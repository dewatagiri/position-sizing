<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop Firm Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #ffffff; --panel: #f5f7f9; --ink: #141b24; --muted: #596473; --line: #dce1e7;
    --accent: #2445b5; --accent-ink: #ffffff;
    --win: #0e7a50; --win-bg: #e7f5ee; --loss: #bf2e3d; --loss-bg: #fbeced;
    --warn: #7d4c00; --warn-bg: #fff3dc;
    --r-lg: 14px; --r-sm: 9px;
    color-scheme: light;
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2029; --ink: #e7ebf0; --muted: #9aa4b2; --line: #2b333e;
      --accent: #8aa1f2; --accent-ink: #0e1320;
      --win: #4cc38a; --win-bg: #15302a; --loss: #f07a86; --loss-bg: #3a1c21;
      --warn: #f2b35b; --warn-bg: #3a2c14; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2029; --ink: #e7ebf0; --muted: #9aa4b2; --line: #2b333e;
    --accent: #8aa1f2; --accent-ink: #0e1320;
    --win: #4cc38a; --win-bg: #15302a; --loss: #f07a86; --loss-bg: #3a1c21;
    --warn: #f2b35b; --warn-bg: #3a2c14; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 22px 18px 40px; }
  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
  h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.15; }
  .tag { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; max-width: 56ch; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  a.pill { text-decoration: none; display: inline-block; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 30px; align-items: start; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .form { display: flex; flex-direction: column; gap: 26px; }
  .block { display: flex; flex-direction: column; gap: 14px; }
  .block > h2 { font-size: 17px; margin: 0; letter-spacing: -0.01em; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .lbl { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .help { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .help b { color: var(--ink); font-weight: 600; }
  .help.bad, .help.bad b { color: var(--loss); }
  .in { width: 100%; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); }
  .in::placeholder { color: var(--muted); opacity: .8; }
  .in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .row2, .row3 { grid-template-columns: 1fr; } }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .pill:hover { border-color: var(--muted); }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .inline .in { width: 92px; flex: none; }
  .suffix { color: var(--muted); font-weight: 600; margin-left: -4px; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sideb { font: inherit; font-size: 15px; font-weight: 700; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .sideb.buy[aria-pressed="true"] { background: var(--win); border-color: var(--win); color: #fff; }
  .sideb.sell[aria-pressed="true"] { background: var(--loss); border-color: var(--loss); color: #fff; }
  :root[data-theme="dark"] .sideb[aria-pressed="true"] { color: #0e1320; }
  details.box { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 13px; background: var(--panel); }
  details.box summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .bgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
  @media (max-width: 460px) { .bgrid { grid-template-columns: 1fr 1fr; } }
  .bgrid .lbl { font-weight: 500; font-size: 12.5px; margin-bottom: 4px; }
  .bgrid .in { font-size: 15px; padding: 8px 10px; }

  .cards { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 16px; }
  @media (max-width: 900px) { .cards { position: static; } }
  .card { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); overflow: hidden; }
  .c-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .c-head h3 { margin: 0; font-size: 15px; }
  .c-head .right { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .c-body { padding: 16px 18px; }
  .meter { margin-bottom: 14px; }
  .meter-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .meter-top span:last-child { color: var(--muted); }
  .bar { height: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--win); width: 0; transition: width .25s; }
  .bar i.mid { background: #c98a00; } .bar i.hi { background: var(--loss); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; }
  .stat { background: var(--bg); padding: 10px 12px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { font-variant-numeric: tabular-nums; font-size: 18px; }
  .stat small { display: block; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat.hl b { color: var(--loss); }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; margin-top: 12px; }
  .warn.bad { background: var(--loss-bg); color: var(--loss); }
  .warn.ok { background: var(--win-bg); color: var(--win); }
  .empty { padding: 30px 18px; color: var(--muted); text-align: center; }
  .empty.bad { color: var(--loss); }

  .badge { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px; color: #fff; background: var(--win); }
  .badge.sell { background: var(--loss); }
  :root[data-theme="dark"] .badge { color: #0e1320; }
  .size { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .size-num { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .size-unit { font-size: 18px; font-weight: 600; color: var(--muted); }
  .size-cap { width: 100%; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .lv { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 10px; }
  .lv.sl { border-color: var(--loss); } .lv.tp { border-color: var(--win); }
  .lv span { display: block; font-size: 12px; color: var(--muted); }
  .lv b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .lv small { display: block; font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lv.sl small { color: var(--loss); } .lv.tp small { color: var(--win); }
  .checks { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: start; }
  .checks .y { color: var(--win); font-weight: 700; } .checks .n { color: var(--loss); font-weight: 700; } .checks .i { color: var(--muted); font-weight: 700; }
  .btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  .ok { font-size: 13px; color: var(--win); font-weight: 600; }
  .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .odd { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; text-align: center; }
  .odd b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .odd span { font-size: 12px; color: var(--muted); }
  .odd.p b { color: var(--win); } .odd.f b { color: var(--loss); }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; }

  footer { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  footer a { color: var(--accent); }
  .linkbtn { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; align-self: flex-start; }
  .modal { position: fixed; inset: 0; background: rgba(10, 15, 25, .5); display: flex; align-items: center; justify-content: center; z-index: 50;
           padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet { background: var(--bg); color: var(--ink); max-width: 640px; width: 100%; max-height: 100%; overflow: auto; border-radius: var(--r-lg); padding: 22px 22px 18px; }
  .sheet h2 { margin: 0 0 10px; font-size: 21px; }
  .sheet p { font-size: 14px; margin: 0 0 10px; max-width: 70ch; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; margin: 14px 0; }
  .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i="title"></h1>
      <p class="tag" data-i="tagline"></p>
    </div>
    <div class="tools">
      <a class="pill" href="index.html" data-i="backLink"></a>
      <div class="seg" role="group" aria-label="Language">
        <button id="l-en" onclick="setLang('en')">EN</button>
        <button id="l-bm" onclick="setLang('bm')">BM</button>
      </div>
      <button class="pill" id="theme-btn" onclick="toggleTheme()"></button>
    </div>
  </header>

  <main class="grid">
    <section class="form">
      <!-- saved accounts -->
      <div class="block">
        <h2 data-i="h_saved"></h2>
        <div class="inline">
          <input class="in" id="sv-name" maxlength="40" autocomplete="off" aria-label="Account name" data-ph="sv_ph">
          <button class="btn" onclick="saveAcct()" data-i="sv_save"></button>
        </div>
        <div class="inline" id="sv-list-wrap" style="margin-top:8px" hidden>
          <select class="in" id="sv-list" aria-label="Saved accounts" onchange="$('sv-name').value = this.value"></select>
          <button class="btn" onclick="loadAcct()" data-i="sv_load"></button>
          <button class="btn" onclick="delAcct()" data-i="sv_del"></button>
        </div>
        <p class="help" id="sv-msg" data-i="sv_help"></p>
      </div>

      <!-- challenge -->
      <div class="block">
        <h2 data-i="h_challenge"></h2>
        <div class="row2">
          <div>
            <label class="lbl" for="firm" data-i="firm"></label>
            <select class="in" id="firm" onchange="onFirm()">
              <option value="bitfunded">Bitfunded</option>
              <option value="ftmo">FTMO</option>
              <option value="fundednext">FundedNext</option>
              <option value="the5ers">The5ers</option>
              <option value="apex">Apex Trader Funding</option>
              <option value="custom" data-i="custom"></option>
            </select>
          </div>
          <div>
            <label class="lbl" for="acct" data-i="acctSize"></label>
            <input class="in" id="acct" inputmode="decimal" value="100,000" oninput="onAcct()">
          </div>
        </div>
        <div class="pills" id="size-chips">
          <button class="pill" data-s="5000">5k</button>
          <button class="pill" data-s="10000">10k</button>
          <button class="pill" data-s="25000">25k</button>
          <button class="pill" data-s="50000">50k</button>
          <button class="pill" data-s="100000">100k</button>
          <button class="pill" data-s="150000">150k</button>
        </div>
        <div id="plan-wrap">
          <span class="lbl" data-i="plan"></span>
          <div class="pills" id="plan-pills"></div>
        </div>
        <details class="box" id="rules-box">
          <summary id="rules-sum"></summary>
          <div class="bgrid">
            <div><label class="lbl" for="r-target" data-i="r_target"></label><input class="in" id="r-target" inputmode="decimal" oninput="onRuleEdit()"></div>
            <div><label class="lbl" for="r-daily" data-i="r_daily"></label><input class="in" id="r-daily" inputmode="decimal" oninput="onRuleEdit()"></div>
            <div><label class="lbl" for="r-max" data-i="r_max"></label><input class="in" id="r-max" inputmode="decimal" oninput="onRuleEdit()"></div>
            <div><label class="lbl" for="r-lev" data-i="r_lev"></label><input class="in" id="r-lev" inputmode="decimal" oninput="onRuleEdit()"></div>
            <div><label class="lbl" for="r-fee" data-i="r_fee"></label><input class="in" id="r-fee" inputmode="decimal" oninput="onRuleEdit()"></div>
            <div><label class="lbl" for="r-expo" data-i="r_expo"></label><input class="in" id="r-expo" inputmode="decimal" oninput="onRuleEdit()"></div>
            <div><label class="lbl" for="r-pos" data-i="r_pos"></label><input class="in" id="r-pos" inputmode="numeric" oninput="onRuleEdit()"></div>
          </div>
          <p class="help" id="rules-src"></p>
        </details>
      </div>

      <!-- now -->
      <div class="block">
        <h2 data-i="h_now"></h2>
        <div class="row3">
          <div><label class="lbl" for="bal" data-i="bal"></label><input class="in" id="bal" inputmode="decimal" oninput="calc()"></div>
          <div><label class="lbl" for="today" data-i="today"></label><input class="in" id="today" inputmode="decimal" placeholder="0" oninput="calc()"></div>
          <div><label class="lbl" for="float" data-i="float"></label><input class="in" id="float" inputmode="decimal" placeholder="0" oninput="calc()"></div>
        </div>
        <p class="help" style="margin-top:-6px" id="now-help"></p>
        <div class="row2">
          <div><label class="lbl" for="open-n" data-i="openN"></label><input class="in" id="open-n" inputmode="numeric" placeholder="0" oninput="calc()"></div>
          <div><label class="lbl" for="mg-used" data-i="mgUsed"></label><input class="in" id="mg-used" inputmode="decimal" placeholder="0" oninput="calc()"></div>
        </div>
      </div>

      <!-- plan -->
      <div class="block">
        <h2 data-i="h_plan"></h2>
        <div>
          <label class="lbl" for="risk" data-i="risk"></label>
          <div class="inline">
            <input class="in" id="risk" inputmode="decimal" value="1" oninput="calc()">
            <span class="suffix">%</span>
            <div class="pills" id="risk-chips">
              <button class="pill" data-r="0.25">0.25%</button>
              <button class="pill" data-r="0.5">0.5%</button>
              <button class="pill" data-r="1">1%</button>
              <button class="pill" data-r="2">2%</button>
            </div>
          </div>
          <p class="help" id="risk-help"></p>
        </div>
        <div>
          <span class="lbl" data-i="rr"></span>
          <div class="inline">
            <div class="pills" id="rr-chips">
              <button class="pill" data-rr="1">1 : 1</button>
              <button class="pill" data-rr="1.5">1 : 1.5</button>
              <button class="pill" data-rr="2">1 : 2</button>
              <button class="pill" data-rr="3">1 : 3</button>
            </div>
            <span class="suffix" style="margin-left:4px">1 :</span>
            <input class="in" id="rr" inputmode="decimal" value="2" aria-label="Custom reward to risk" oninput="calc()">
          </div>
        </div>
        <div class="row3">
          <div><label class="lbl" for="cap" data-i="cap"></label><input class="in" id="cap" inputmode="numeric" value="2" oninput="calc()"></div>
          <div><label class="lbl" for="tpd" data-i="tpd"></label><input class="in" id="tpd" inputmode="numeric" value="2" oninput="calc()"></div>
          <div><label class="lbl" for="wr" data-i="wr"></label><input class="in" id="wr" inputmode="decimal" value="40" oninput="calc()"></div>
        </div>
        <p class="help" style="margin-top:-6px" data-i="planHelp"></p>
      </div>

      <!-- trade -->
      <div class="block">
        <h2 data-i="h_trade"></h2>
        <div class="row2">
          <div><label class="lbl" for="sym" data-i="sym"></label><input class="in" id="sym" value="BTCUSDT" autocomplete="off" spellcheck="false" oninput="calc()"></div>
          <div><label class="lbl" for="lev" data-i="lev"></label><input class="in" id="lev" inputmode="decimal" value="5" oninput="calc()"></div>
        </div>
        <div class="sides">
          <button class="sideb buy" id="s-buy" onclick="setSide(1)" data-i="buy"></button>
          <button class="sideb sell" id="s-sell" onclick="setSide(-1)" data-i="sell"></button>
        </div>
        <div class="row2">
          <div><label class="lbl" for="entry" data-i="entry"></label><input class="in" id="entry" inputmode="decimal" autocomplete="off" placeholder="83500" oninput="calc()"></div>
          <div><label class="lbl" for="sl" data-i="sl"></label><input class="in" id="sl" inputmode="decimal" autocomplete="off" oninput="calc()"><p class="help" id="sl-help"></p></div>
        </div>
        <div>
          <span class="lbl" data-i="stopSize"></span>
          <div class="inline">
            <div class="pills" id="stop-chips">
              <button class="pill" data-st="0.5">0.5%</button>
              <button class="pill" data-st="1">1%</button>
              <button class="pill" data-st="2">2%</button>
              <button class="pill" data-st="3">3%</button>
            </div>
            <input class="in" id="stop" inputmode="decimal" value="1" aria-label="Custom stop size in percent" oninput="onStopCustom()">
            <span class="suffix">%</span>
          </div>
        </div>
        <div class="row2">
          <div><label class="lbl" for="step" data-i="step"></label><input class="in" id="step" inputmode="decimal" value="0.001" oninput="calc()"></div>
          <div></div>
        </div>
      </div>
    </section>

    <section class="cards" aria-live="polite">
      <!-- room -->
      <div class="card">
        <div class="c-head"><h3 data-i="c_room"></h3><span class="right" id="room-right"></span></div>
        <div class="c-body" id="room-body">
          <div class="meter"><div class="meter-top"><span data-i="m_daily"></span><span id="m-daily-txt"></span></div><div class="bar"><i id="m-daily"></i></div></div>
          <div class="meter"><div class="meter-top"><span data-i="m_max"></span><span id="m-max-txt"></span></div><div class="bar"><i id="m-max"></i></div></div>
          <div class="meter" id="m-tgt-wrap"><div class="meter-top"><span data-i="m_tgt"></span><span id="m-tgt-txt"></span></div><div class="bar"><i id="m-tgt" style="background:var(--accent)"></i></div></div>
          <div class="stats">
            <div class="stat"><span data-i="s_today"></span><b id="s-today"></b><small id="s-today-n"></small></div>
            <div class="stat"><span data-i="s_total"></span><b id="s-total"></b><small id="s-total-n"></small></div>

// worst case: take the most losses you are allowed each day (never breaching the daily limit) until the max loss is hit
function daysToBreach(L, cap, roomToday, dailyLimit, roomTotal) {
  if (!(L > 0)) return null;
  let room = roomTotal;
  for (let day = 1; day <= 2000; day++) {
    const dayRoom = day === 1 ? roomToday : dailyLimit;
    let n = Math.min(cap, Math.floor((dayRoom - 1e-9) / L));
    if (day > 1 && n <= 0) return { days: null, perDay: 0 };
    for (let i = 0; i < Math.max(n, 0); i++) { room -= L; if (room <= 1e-9) return { days: day, perDay: Math.min(cap, Math.floor((dailyLimit - 1e-9) / L)) }; }
    if (room - L <= 1e-9 && n === 0 && day === 1) continue;
  }
  return { days: null, perDay: 0 };
}

function simulate(o) {
  const R = rng(20261017), runs = 4000, maxDays = o.target > 0 ? 120 : 30;
  let pass = 0, fail = 0, still = 0; const dPass = [], dFail = [];
  for (let k = 0; k < runs; k++) {
    let eq = o.equity, done = false;
    for (let day = 1; day <= maxDays && !done; day++) {
      let dayRoom = day === 1 ? o.roomToday : o.dailyLimit, losses = 0;
      for (let tr = 0; tr < o.tpd; tr++) {
        if (losses >= o.cap) break;
        if (o.L >= dayRoom - 1e-9) break;                       // disciplined: skip a trade that could breach today
        if (o.L >= eq - o.floor - 1e-9) { fail++; dFail.push(day); done = true; break; }   // out of room
        if (R() < o.wr) { eq += o.W; }
        else { eq -= o.L; dayRoom -= o.L; losses++; }
        if (o.target > 0 && eq >= o.targetBal - 1e-9) { pass++; dPass.push(day); done = true; break; }

  return { runs, pass: pass / runs, fail: fail / runs, still: still / runs, medPass: med(dPass), medFail: med(dFail), maxDays };
}

function sizeTrade(r, size, bal, riskUsd, rr, roomToday, roomTotal) {

  const entry = num($('entry').value);

  $('t-risk').textContent = riskUsd > 0 ? `${state.lang === 'bm' ? 'Risiko' : 'Risk'} ${fmtUsd(riskUsd)}` : '';

  let sl = num($('sl').value), slAuto = false;
  if (!(sl > 0) && entry > 0 && state.stopPct > 0 && (side === -1 || state.stopPct < 100)) { sl = entry * (1 - side * state.stopPct / 100); slAuto = true; }
  const dec = entry > 0 ? pxDec(entry) : 2;

  const slHelp = $('sl-help'); slHelp.className = 'help';
  if (entry > 0 && sl > 0) {

    slHelp.innerHTML = slAuto ? t('slAuto', trim(state.stopPct), `<b>${fmtN(d, dec)}</b>`, sl < entry ? t('below') : t('above')) : `<b>${fmtN(d, dec)}</b> (${fmtN(d / entry * 100, 2)}%) ${sl < entry ? t('below') : t('above')}`;
    if ((entry - sl) * side <= 0) slHelp.className = 'help bad';
  } else slHelp.textContent = '';

  if (!(riskUsd > 0)) { showTicketMsg(t('t_emptyRisk'), true); return null; }
  if (!(entry > 0)) { showTicketMsg(t('t_empty1'), false); return null; }
  if (!(sl > 0) || (entry - sl) * side <= 0) { showTicketMsg(t(side === 1 ? 't_slBuy' : 't_slSell'), true); return null; }

  const dist = Math.abs(entry - sl);
  const costPer = dist + r.fee * (entry + sl);                  // loss + open/close fees per 1 unit
  let qty = +(Math.floor(riskUsd / costPer / step + 1e-9) * step).toFixed(sd);

  const expo = (margin + mgUsed) / bal * 100;
  const maxQtyExpo = Math.max(0, +(Math.floor(((r.expo / 100) * bal - mgUsed - 0.01) * levEff / entry / step) * step).toFixed(sd));
  const openN = Math.max(0, Math.round(num($('open-n').value) || 0));
  const [holdDays, holdCat] = holdInfo(sym);
  const bit = firmKey() === 'bitfunded', minTrades = state.plan === 'inst' ? 3 : 2;

  $('t-empty').hidden = true; $('t-body').hidden = false;
  $('t-size').textContent = fmtN(qty, sd); $('t-unit').textContent = coin;
  $('lv-sl').textContent = fmtN(sl, dec); $('lv-sl-n').textContent = '-' + fmtUsd(lossAll);
  $('lv-en').textContent = fmtN(entry, dec);
  $('lv-tp').textContent = exit > 0 ? fmtN(exit, dec) : '–'; $('lv-tp-n').textContent = exit > 0 ? sgn(net) : '';
  $('s-expo').textContent = `${fmtN(expo, 1)}%`; $('s-expo-n').textContent = t('expoSub', trim(r.expo), fmtUsd(margin));
  $('s-fees').textContent = r.fee > 0 ? `${fmtUsd(feeSl)} / ${fmtUsd(feeTp)}` : '–'; $('s-fees-n').textContent = r.fee > 0 ? `${trim(r.fee * 100)}% / side` : '';

  const ck = (ok, txt) => `<li><span class="${ok === null ? 'i' : ok ? 'y' : 'n'}">${ok === null ? 'i' : ok ? '✓' : '✗'}</span><span>${txt}</span></li>`;
  const inDay = lossAll < roomToday, inMax = lossAll < roomTotal, inExpo = expo < r.expo, inLev = lev <= r.lev, inPos = openN + 1 <= r.pos;
  $('checks').innerHTML =
    ck(inDay, inDay ? t('ck_daily', fmtUsd(lossAll), fmtUsd(Math.max(0, roomToday))) : t('ck_dailyN', fmtUsd(lossAll), fmtUsd(Math.max(0, roomToday)))) +
    ck(inMax, inMax ? t('ck_max', fmtUsd(Math.max(0, roomTotal))) : t('ck_maxN', fmtUsd(Math.max(0, roomTotal)))) +
    ck(inExpo, inExpo ? t('ck_expo', fmtN(expo, 1), trim(r.expo)) : t('ck_expoN', fmtN(expo, 1), trim(r.expo), `${fmtN(maxQtyExpo, sd)} ${coin}`)) +
    ck(inLev, inLev ? t('ck_lev', trim(lev), trim(r.lev)) : t('ck_levN', trim(lev), trim(r.lev))) +
    ck(inPos, inPos ? t('ck_pos', openN + 1, r.pos) : t('ck_posN', openN + 1, r.pos)) +
    (bit ? ck(null, t('ck_hold', holdDays, holdCat)) + ck(null, t('ck_act', minTrades)) + ck(null, t('ck_sl')) : '');

  state.last = { side, sym, coin, qty: fmtN(qty, sd), entry: fmtN(entry, dec), sl: fmtN(sl, dec), tp: exit > 0 ? fmtN(exit, dec) : '-', loss: fmtUsd(lossAll), net: sgn(net), rr: trim(+rr.toFixed(2)), lev: trim(lev) };
  return { ok: true, lossAll, net, rr };
}

// ---------------- saved accounts ----------------
// Only written when the user taps Save. Stays in this browser (localStorage), never sent anywhere.
const SAVE_KEY = 'pf-saves';
const SAVE_IDS = ['firm', 'acct', 'r-target', 'r-daily', 'r-max', 'r-lev', 'r-fee', 'r-expo', 'r-pos', 'bal', 'today', 'float', 'open-n', 'mg-used', 'risk', 'rr', 'cap', 'tpd', 'wr', 'sym', 'lev', 'entry', 'sl', 'stop', 'step'];
function readSaves() { try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); return o && typeof o === 'object' ? o : {}; } catch (e) { return {}; } }
function writeSaves(o) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
function renderSaves(sel) {
  const names = Object.keys(readSaves());
  $('sv-list-wrap').hidden = !names.length;
  $('sv-list').innerHTML = names.map(n => `<option></option>`).join('');
  [...$('sv-list').options].forEach((o, i) => { o.value = o.textContent = names[i]; });
  if (sel && names.includes(sel)) $('sv-list').value = sel;
}
function svMsg(k, ...a) { const el = $('sv-msg'); el.textContent = t(k, ...a); clearTimeout(el._t); el._t = setTimeout(() => { el.textContent = t('sv_help'); }, 3000); }
function saveAcct() {
  const name = $('sv-name').value.trim();
  if (!name) { svMsg('sv_noname'); $('sv-name').focus(); return; }
  const all = readSaves();
  if (!(name in all) && Object.keys(all).length >= 20) { svMsg('sv_full'); return; }
  const d = { plan: state.plan, side: state.side, stopPct: state.stopPct, at: Date.now() };
  SAVE_IDS.forEach(id => { d[id] = $(id).value; });
  all[name] = d;
  if (!writeSaves(all)) { svMsg('sv_fail'); return; }
  renderSaves(name); svMsg('sv_saved', name);
}
function loadAcct() {
  const name = $('sv-list').value, d = readSaves()[name];
  if (!d) return;
  $('firm').value = d.firm;
  if (!$('firm').value) $('firm').value = 'custom';
  state.plan = d.plan; onFirm();
  SAVE_IDS.forEach(id => { if (id !== 'firm' && typeof d[id] === 'string') $(id).value = d[id]; });
  state.side = d.side === -1 ? -1 : 1;
  state.stopPct = num(d.stopPct) > 0 ? num(d.stopPct) : state.stopPct;
  $('sv-name').value = name;
  calc(); svMsg('sv_loaded', name);
}
function delAcct() {
  const name = $('sv-list').value, all = readSaves();
  if (!(name in all) || !confirm(t('sv_confirm', name))) return;
  delete all[name]; writeSaves(all);
  if ($('sv-name').value === name) $('sv-name').value = '';
  renderSaves(); svMsg('sv_deleted', name);
}

// ---------------- disclaimer ----------------
function discAccepted() { try { return sessionStorage.getItem('pf-disc') === '1'; } catch (e) { return false; } }
function openDisc() { const acc = discAccepted(); $('disc-check-wrap').hidden = acc; $('disc-go').disabled = !acc; $('disc').hidden = false; document.body.style.overflow = 'hidden'; $('disc-go').focus(); }
function closeDisc() { if (!discAccepted()) { if (!$('disc-check').checked) return; try { sessionStorage.setItem('pf-disc', '1'); } catch (e) {} } $('disc').hidden = true; document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('disc').hidden && discAccepted()) closeDisc(); });

// ---------------- wiring ----------------
document.querySelectorAll('#size-chips .pill').forEach(b => b.addEventListener('click', () => { $('acct').value = fmtN(num(b.dataset.s), 0); onAcct(); }));
document.querySelectorAll('#risk-chips .pill').forEach(b => b.addEventListener('click', () => { $('risk').value = b.dataset.r; calc(); }));
document.querySelectorAll('#rr-chips .pill').forEach(b => b.addEventListener('click', () => { $('rr').value = b.dataset.rr; calc(); }));
document.querySelectorAll('#stop-chips .pill').forEach(b => b.addEventListener('click', () => setStop(num(b.dataset.st))));

(function init() {
  let l = (navigator.language || '').toLowerCase().startsWith('ms') ? 'bm' : 'en', th = 'light';
  try { l = localStorage.getItem('ps-lang') || l; th = localStorage.getItem('ps-theme') || th; } catch (e) {}
  state.lang = l; state.theme = th;
  document.documentElement.setAttribute('data-theme', th);
  applyText();
  loadPlan('s1');
  renderSaves();
  if (!discAccepted()) openDisc();
})();
</script>
</body>
</html>
