name: Daily Prop Trading Telegram Briefing

on:
  schedule:
    # 21:00 MYT is 13:00 UTC (Night-before structure review: Prompt 2)
    - cron: '0 13 * * *'
    # 08:30 MYT is 00:30 UTC (Pre-session event check & plan: Prompt 3 & 7)
    - cron: '30 0 * * *'
    # 09:50 New York on weekdays, in both DST states (the script skips the one that is off-hours):
    # 13:50 UTC = 09:50 EDT, 14:50 UTC = 09:50 EST (Opening range breakout)
    - cron: '50 13 * * 1-5'
    - cron: '50 14 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Briefing Mode'
        required: true
        default: 'night'
        type: choice
        options:
          - night
          - presession
          - sectors
          - orb

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Mode and Run Briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            case "$SCHEDULE" in
              '0 13 * * *') MODE="night" ;;
              '30 0 * * *') MODE="presession" ;;
              '50 13 * * 1-5'|'50 14 * * 1-5') MODE="orb"; export ORB_GATE=1 ;;
              *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "Executing mode: $MODE"
          python scripts/daily_prop_brief.py "$MODE"
