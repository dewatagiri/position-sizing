<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Position Sizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #ffffff; --panel: #f5f7f9; --ink: #141b24; --muted: #596473; --line: #dce1e7;
    --accent: #2445b5; --accent-ink: #ffffff;
    --win: #0e7a50; --win-bg: #e7f5ee; --loss: #bf2e3d; --loss-bg: #fbeced;
    --warn: #7d4c00; --warn-bg: #fff3dc;
    --r-lg: 14px; --r-sm: 9px;
    color-scheme: light;
    font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --panel: #1a2029; --ink: #e7ebf0; --muted: #9aa4b2; --line: #2b333e;
      --accent: #8aa1f2; --accent-ink: #0e1320;
      --win: #4cc38a; --win-bg: #15302a; --loss: #f07a86; --loss-bg: #3a1c21;
      --warn: #f2b35b; --warn-bg: #3a2c14; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --panel: #1a2029; --ink: #e7ebf0; --muted: #9aa4b2; --line: #2b333e;
    --accent: #8aa1f2; --accent-ink: #0e1320;
    --win: #4cc38a; --win-bg: #15302a; --loss: #f07a86; --loss-bg: #3a1c21;
    --warn: #f2b35b; --warn-bg: #3a2c14; color-scheme: dark;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 22px 18px 40px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.15; }
  .tag { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; max-width: 52ch; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

  .tabs { display: flex; gap: 2px; margin: 18px 0 22px; border-bottom: 1px solid var(--line); }
  .tabs button { font: inherit; font-size: 14.5px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; margin-bottom: -1px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 30px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .form { display: flex; flex-direction: column; gap: 18px; }
  .lbl { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
  .help { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
  .help b { color: var(--ink); font-weight: 600; }
  .help.bad, .help.bad b { color: var(--loss); }
  .in { width: 100%; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); }
  .in::placeholder { color: var(--muted); opacity: .8; }
  .in:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .pill:hover { border-color: var(--muted); }
  .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .inline .in { width: 92px; flex: none; }
  .suffix { color: var(--muted); font-weight: 600; margin-left: -4px; }

  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sideb { font: inherit; font-size: 15px; font-weight: 700; padding: 11px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .sideb.buy[aria-pressed="true"] { background: var(--win); border-color: var(--win); color: #fff; }
  .sideb.sell[aria-pressed="true"] { background: var(--loss); border-color: var(--loss); color: #fff; }
  :root[data-theme="dark"] .sideb[aria-pressed="true"] { color: #0e1320; }

  details.box { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 13px; background: var(--panel); }
  details.box summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
  .bgrid .lbl { font-weight: 500; font-size: 12.5px; margin-bottom: 4px; }
  .bgrid .in { font-size: 15px; padding: 8px 10px; }
  .linkbtn { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }

  /* ticket */
  .ticket { position: sticky; top: 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); overflow: hidden; }
  @media (max-width: 860px) { .ticket { position: static; } }
  .t-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .badge { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px; color: #fff; background: var(--win); }
  .badge.sell { background: var(--loss); }
  :root[data-theme="dark"] .badge { color: #0e1320; }
  .t-sym { font-weight: 700; letter-spacing: .01em; }
  .t-risk { margin-left: auto; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .t-main { padding: 18px 18px 16px; }
  .empty { padding: 44px 22px; color: var(--muted); text-align: center; font-size: 15px; }
  .empty.bad { color: var(--loss); }
  .size { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .size-num { font-size: 46px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .size-unit { font-size: 19px; font-weight: 600; color: var(--muted); }
  .size-cap { width: 100%; font-size: 13.5px; color: var(--muted); margin-top: 2px; }

  .lad { margin: 22px 0 4px; }
  .lad-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
  .lad-dot { width: 15px; height: 15px; border-radius: 50%; justify-self: center; background: currentColor; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px currentColor; }
  .lad-row.tp { color: var(--win); } .lad-row.sl { color: var(--loss); } .lad-row.en { color: var(--ink); }
  .lad-name { display: block; font-size: 12.5px; color: var(--muted); }
  .lad-price { font-size: 21px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .lad-amt { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--muted); }
  .lad-amt b { display: block; font-size: 16px; }
  .lad-row.tp .lad-amt b { color: var(--win); } .lad-row.sl .lad-amt b { color: var(--loss); }
  .lad-zone { display: grid; grid-template-columns: 22px 1fr; gap: 12px; }
  .lad-zone i { justify-self: center; width: 5px; border-radius: 3px; display: block; }
  .lad-zone.win i { background: var(--win); } .lad-zone.loss i { background: var(--loss); }
  .lad-zone span { align-self: center; font-size: 12px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; margin-top: 18px; }
  .stat { background: var(--bg); padding: 9px 12px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { font-variant-numeric: tabular-nums; font-size: 15px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13.5px; margin-top: 12px; }
  .warn.bad { background: var(--loss-bg); color: var(--loss); }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .btn { font: inherit; font-weight: 600; font-size: 14px; padding: 10px 15px; border-radius: var(--r-sm); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .ok { font-size: 13px; color: var(--win); font-weight: 600; }
  details.more { border-top: 1px solid var(--line); padding: 12px 18px 16px; }
  details.more summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .sub { font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .tbl th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl tr.amber td { background: var(--warn-bg); }
  .scroll { overflow-x: auto; }
  .note { font-size: 12px; color: var(--muted); margin-top: 12px; }

  /* planner */
  .pgrid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 30px; align-items: start; }
  @media (max-width: 860px) { .pgrid { grid-template-columns: 1fr; } }
  .card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; }
  .big { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 2px 0 4px; }
  svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .tblwrap { margin-top: 22px; }
  .usebtn { font: inherit; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); cursor: pointer; }

  footer { margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }

  .modal { position: fixed; inset: 0; background: rgba(10, 15, 25, .5); display: flex; align-items: center; justify-content: center; z-index: 50;
           padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet { background: var(--bg); color: var(--ink); max-width: 640px; width: 100%; max-height: 100%; overflow: auto; border-radius: var(--r-lg); padding: 22px 22px 18px; }
  .sheet h2 { margin: 0 0 10px; font-size: 21px; letter-spacing: -0.01em; }
  .sheet p { font-size: 14px; margin: 0 0 10px; max-width: 70ch; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; margin: 14px 0; }
  .check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .mbar { display: none; }
  @media (max-width: 860px) {
    .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; gap: 12px; align-items: center; justify-content: space-between;
            background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
            font-variant-numeric: tabular-nums; font-size: 13.5px; box-shadow: 0 -6px 18px rgba(0, 0, 0, .07); }
    body.has-mbar .wrap { padding-bottom: 96px; }
  }
  .mbar b { font-size: 16px; } .mbar span { color: var(--muted); }
  .mbar .m-sl { color: var(--loss); font-weight: 600; } .mbar .m-tp { color: var(--win); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i="title">Position Sizing</h1>
      <p class="tag" data-i="tagline"></p>
    </div>
    <div class="tools">
      <a class="pill" href="prop.html" style="text-decoration:none" data-i="propLink"></a>
      <div class="seg" role="group" aria-label="Language">
        <button id="l-en" onclick="setLang('en')">EN</button>
        <button id="l-bm" onclick="setLang('bm')">BM</button>
      </div>
      <button class="pill" id="theme-btn" onclick="toggleTheme()"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-sizer" aria-selected="true" onclick="showTab('sizer')" data-i="tabSizer"></button>
    <button role="tab" id="tab-plan" aria-selected="false" onclick="showTab('plan')" data-i="tabPlan"></button>
  </nav>

  <!-- ===================== SIZER ===================== -->
  <main id="v-sizer" class="grid">
    <section class="form">
      <div>
        <span class="lbl" data-i="instrument"></span>
        <div class="pills" id="asset-pills">
          <button class="pill" data-a="crypto" data-i="a_crypto"></button>
          <button class="pill" data-a="gold" data-i="a_gold"></button>
          <button class="pill" data-a="fxusd" data-i="a_fxusd"></button>
          <button class="pill" data-a="usdxxx" data-i="a_usdxxx"></button>
          <button class="pill" data-a="index" data-i="a_index"></button>
        </div>
        <p class="help" id="asset-ex"></p>
      </div>

      <div class="row2">
        <div>
          <label class="lbl" for="symbol" data-i="symbol"></label>
          <input class="in" id="symbol" autocomplete="off" spellcheck="false" oninput="calc()">
        </div>
        <div>
          <label class="lbl" for="equity" data-i="equity"></label>
          <input class="in" id="equity" inputmode="decimal" autocomplete="off" value="100,000" oninput="calc()">
        </div>
      </div>

      <div>
        <label class="lbl" for="riskpct" data-i="risk"></label>
        <div class="inline">
          <input class="in" id="riskpct" inputmode="decimal" autocomplete="off" value="2" oninput="calc()">
          <span class="suffix">%</span>
          <div class="pills" id="risk-chips">
            <button class="pill" data-r="0.5">0.5%</button>
            <button class="pill" data-r="1">1%</button>
            <button class="pill" data-r="2">2%</button>
            <button class="pill" data-r="3">3%</button>
          </div>
        </div>
        <p class="help" data-i="riskHelp"></p>
      </div>

      <div>
        <span class="lbl" data-i="side"></span>
        <div class="sides">
          <button class="sideb buy" id="s-buy" onclick="setSide(1)" data-i="buy"></button>
          <button class="sideb sell" id="s-sell" onclick="setSide(-1)" data-i="sell"></button>
        </div>
      </div>

      <div class="row2">
        <div>
          <label class="lbl" for="entry" data-i="entry"></label>
          <input class="in" id="entry" inputmode="decimal" autocomplete="off" oninput="calc()">
          <p class="help" data-i="entryHelp"></p>
        </div>
        <div>
          <label class="lbl" for="sl" data-i="sl"></label>
          <input class="in" id="sl" inputmode="decimal" autocomplete="off" oninput="calc()">
          <p class="help" id="sl-help"></p>
        </div>
      </div>

      <div>
        <span class="lbl" data-i="stopSize"></span>
        <div class="inline">
          <div class="pills" id="stop-chips">
            <button class="pill" data-s="0.25">0.25%</button>
            <button class="pill" data-s="0.5">0.5%</button>
            <button class="pill" data-s="1">1%</button>
            <button class="pill" data-s="2">2%</button>
          </div>
          <input class="in" id="stop-custom" inputmode="decimal" autocomplete="off" aria-label="Custom stop size in percent" oninput="onStopCustom()">
          <span class="suffix">%</span>
        </div>
        <p class="help" data-i="stopHelp"></p>
      </div>

      <div>
        <span class="lbl" data-i="rr"></span>
        <div class="inline">
          <div class="pills" id="rr-chips">
            <button class="pill" data-rr="1">1 : 1</button>
            <button class="pill" data-rr="1.5">1 : 1.5</button>
            <button class="pill" data-rr="2">1 : 2</button>
            <button class="pill" data-rr="3">1 : 3</button>
          </div>
          <span class="suffix" style="margin-left:4px">1 :</span>
          <input class="in" id="rr-custom" inputmode="decimal" autocomplete="off" value="2" aria-label="Custom reward to risk" oninput="onRRCustom()">
        </div>
      </div>

      <div>
        <label class="lbl" for="exit" data-i="exit"></label>
        <input class="in" id="exit" inputmode="decimal" autocomplete="off" oninput="calc()">
        <p class="help" id="exit-help" data-i="exitHelp"></p>
      </div>

      <details class="box" id="broker">
        <summary data-i="broker"></summary>
        <p class="help" data-i="brokerHelp"></p>
        <div class="bgrid">
          <div>
            <label class="lbl" for="b-acct" data-i="acct"></label>
            <select class="in" id="b-acct" onchange="calc()">
              <option value="1" data-i="std"></option>
              <option value="0.1" data-i="micro"></option>
              <option value="0.01" data-i="cent"></option>
            </select>
          </div>
          <div>
            <label class="lbl" for="b-lev" data-i="lev"></label>
            <input class="in" id="b-lev" inputmode="decimal" value="20" oninput="calc()">
          </div>
          <div>
            <label class="lbl" for="b-contract" id="b-contract-lbl"></label>
            <input class="in" id="b-contract" inputmode="decimal" oninput="calc()">
          </div>
          <div>
            <label class="lbl" for="b-step" data-i="step"></label>
            <input class="in" id="b-step" inputmode="decimal" oninput="calc()">
          </div>
          <div>
            <label class="lbl" for="b-min" data-i="min"></label>
            <input class="in" id="b-min" inputmode="decimal" oninput="calc()">
          </div>
          <div>
            <label class="lbl" for="b-fee" data-i="fee"></label>
            <input class="in" id="b-fee" inputmode="decimal" oninput="calc()">
          </div>
          <div id="mmr-wrap">
            <label class="lbl" for="b-mmr" data-i="mmr"></label>
            <input class="in" id="b-mmr" inputmode="decimal" oninput="calc()">
          </div>
          <div style="display:flex;align-items:flex-end">
            <button class="linkbtn" onclick="resetBroker()" data-i="resetBroker"></button>
          </div>
        </div>
        <p class="help" id="fee-help"></p>
        <p class="help" id="acct-help" hidden data-i="centHelp"></p>
      </details>
    </section>

    <section class="ticket" aria-live="polite">
      <div class="t-head">
        <span class="badge" id="t-side"></span>
        <span class="t-sym" id="t-sym"></span>
        <span class="t-risk" id="t-risk"></span>
      </div>
      <div class="empty" id="t-empty"></div>
      <div id="t-body" hidden>
        <div class="t-main">
          <div class="size">
            <span class="size-num" id="t-size"></span>
            <span class="size-unit" id="t-unit"></span>
            <span class="size-cap" data-i="sizeCap"></span>
          </div>
          <p class="help" id="t-auto" hidden></p>
          <div class="lad" id="ladder"></div>
          <div class="stats">
            <div class="stat"><span data-i="statRR"></span><b id="st-rr"></b></div>
            <div class="stat"><span data-i="statBE"></span><b id="st-be"></b></div>
            <div class="stat"><span data-i="statValue"></span><b id="st-val"></b></div>
            <div class="stat"><span id="st-mg-lbl"></span><b id="st-mg"></b></div>
            <div class="stat"><span data-i="statFees"></span><b id="st-fee"></b></div>
            <div class="stat"><span data-i="statLiq"></span><b id="st-liq"></b></div>
          </div>
          <div id="t-warn"></div>
          <div class="actions">
            <button class="btn" onclick="copyOrder()" data-i="copy"></button>
            <span class="ok" id="copy-ok" hidden></span>
          </div>
        </div>
        <details class="more">
          <summary data-i="details"></summary>
          <div class="sub" data-i="dTargets"></div>
          <div class="scroll"><table class="tbl" id="tp-table"></table></div>
          <div class="sub" data-i="dSplit"></div>
          <div class="pills" id="split-chips">
            <button class="pill" data-n="1">1</button>
            <button class="pill" data-n="2">2</button>
            <button class="pill" data-n="3">3</button>
            <button class="pill" data-n="4">4</button>
          </div>

function broker() {
  const a = ASSETS[state.asset];
  const mult = num($('b-acct').value) || 1;
  const contract = num($('b-contract').value) > 0 ? num($('b-contract').value) : a.contract;
  const step = num($('b-step').value) > 0 ? num($('b-step').value) : a.step;
  const minSz = num($('b-min').value) > 0 ? num($('b-min').value) : step;
  const lev = Math.max(1, num($('b-lev').value) || 1);
  const fee = Math.max(0, num($('b-fee').value) || 0) / 100;
  const mmr = Math.max(0, num($('b-mmr').value) || 0) / 100;
  return { a, mult, contract, step, minSz, lev, fee, mmr, sd: decOf(step) };
}
// USD value of a price move d per 1.0 size, measured at price px
function moneyPerSize(b, d, px) { return b.a.usdBase ? d * b.contract * b.mult / px : d * b.contract * b.mult; }
function roundDown(x, step) { return Math.floor(x / step + 1e-9) * step; }

function cleanSym(v, a) { return (String(v || '').toUpperCase().replace(/[^A-Z0-9._\/-]/g, '') || a.sym); }
function coinOf(sym, a) { return a.coin ? (sym.replace(/(USDT|USDC|USD|PERP|-|\/)+$/g, '') || t('coins')) : t('lots'); }
const notionalPer = (b, px) => b.a.usdBase ? b.contract * b.mult : b.contract * b.mult * px;
const feePer = (b, p1, p2) => b.fee * (notionalPer(b, p1) + notionalPer(b, p2));

function calc() {
  const b = broker(), a = b.a;
  const eq = num($('equity').value), rp = num($('riskpct').value);
  const entry = num($('entry').value), side = state.side;
  const sym = cleanSym($('symbol').value, a);
  const coinName = coinOf(sym, a);
  const unitTxt = t(a.unit === 'pts' ? 'u_pts' : 'u_pips');
  const riskUsd = eq > 0 && rp > 0 ? eq * rp / 100 : 0;

  // no stop price typed: place the stop at the chosen % from entry
  const stopOk = state.stopPct > 0 && (side === -1 || state.stopPct < 100);
  let sl = num($('sl').value), slAuto = false;
  if (!(sl > 0) && entry > 0 && stopOk) { sl = entry * (1 - side * state.stopPct / 100); slAuto = true; }
  document.querySelectorAll('#stop-chips .pill').forEach(c => c.setAttribute('aria-pressed', num(c.dataset.s) === state.stopPct));
  if (document.activeElement !== $('stop-custom')) $('stop-custom').value = state.stopPct;
  $('sl').placeholder = slAuto ? `${t('auto')}: ${fmtN(sl, priceDec(a, entry))}` : '';

  // controls state
  document.querySelectorAll('#risk-chips .pill').forEach(c => c.setAttribute('aria-pressed', num(c.dataset.r) === rp));
  $('s-buy').setAttribute('aria-pressed', side === 1);
  $('s-sell').setAttribute('aria-pressed', side === -1);
  $('asset-ex').textContent = t('ex_' + state.asset);
  $('b-contract-lbl').textContent = a.coin ? t('contractCoin') : t('contractLot');
  $('entry').placeholder = fmtN(a.ref, priceDec(a, a.ref)).replace(/,/g, '');
  $('acct-help').hidden = $('b-acct').value === '1';
  $('mmr-wrap').hidden = !a.coin;
  $('fee-help').textContent = t(a.coin ? 'feeHelpCrypto' : 'feeHelpOther');

  $('t-side').textContent = t(side === 1 ? 'sideBuy' : 'sideSell');
  $('t-side').className = 'badge' + (side === -1 ? ' sell' : '');
  $('t-sym').textContent = sym;
  $('t-risk').textContent = riskUsd > 0 ? `${t('riskLbl')} ${fmtUsd(riskUsd)} (${trim(rp)}%)` : '';

  // SL helper line
  const slHelp = $('sl-help');
  slHelp.className = 'help';
  if (entry > 0 && sl > 0) {
    const d = Math.abs(entry - sl), dec = priceDec(a, entry);
    const units = d / pipSize(a, entry);
    slHelp.innerHTML = `${slAuto ? t('auto') + ' ' + trim(state.stopPct) + '%: ' : ''}<b>${fmtN(d, dec)}</b> (${fmtN(units, 1)} ${unitTxt}) ${sl < entry ? t('below') : t('above')}`;
    if ((entry - sl) * side <= 0) slHelp.className = 'help bad';
  } else {
    slHelp.textContent = t('slHelp');
  }

  let msg = null, bad = false;
  if (!(eq > 0)) msg = t('empty0');
  else if (!(rp > 0)) { msg = t('emptyRisk'); bad = true; }
  else if (!(entry > 0)) msg = t('empty1');
  else if (!(sl > 0)) { msg = stopOk ? t('empty2') : t('errStopPct'); bad = !stopOk; }
  else if ((entry - sl) * side <= 0) { msg = t(side === 1 ? 'errSlBuy' : 'errSlSell'); bad = true; }
  document.querySelectorAll('#rr-chips .pill').forEach(c => c.setAttribute('aria-pressed', !$('exit').value.trim() && num(c.dataset.rr) === state.rr));
  if (msg) {
    $('t-empty').textContent = msg;
    $('t-empty').className = 'empty' + (bad ? ' bad' : '');
    $('t-empty').hidden = false; $('t-body').hidden = true;
    $('exit').placeholder = '';
    state.last = null; updateMbar();
    return;
  }
  $('t-empty').hidden = true; $('t-body').hidden = false;

  const dec = priceDec(a, entry), pip = pipSize(a, entry);
  const dist = Math.abs(entry - sl);
  const lossPer = moneyPerSize(b, dist, sl);
  const costPer = lossPer + feePer(b, entry, sl);           // loss + round-trip fees per 1.0 size
  const raw = riskUsd / costPer;
  let size = +roundDown(raw, b.step).toFixed(b.sd);
  let forcedMin = false;
  if (size < b.minSz) { size = b.minSz; forcedMin = true; }
  const loss = size * lossPer, feeSl = size * feePer(b, entry, sl), lossAll = loss + feeSl;

  // exit: typed price overrides the R:R target
  let rr = state.rr, exitErr = '';
  const typed = num($('exit').value);
  if (typed > 0) {
    const mv = (typed - entry) * side;
    if (mv > 0) rr = mv / dist; else exitErr = t(side === 1 ? 'errExitBuy' : 'errExitSell');
  }
  const exit = entry + side * dist * rr;
  const autoExit = entry + side * dist * state.rr;
  $('exit').placeholder = autoExit > 0 ? `${t('auto')}: ${fmtN(autoExit, dec)}` : '';
  if (document.activeElement !== $('rr-custom')) $('rr-custom').value = trim(+rr.toFixed(2));
  const eh = $('exit-help');
  eh.textContent = exitErr || t('exitHelp');
  eh.className = exitErr ? 'help bad' : 'help';

  const gain = exit > 0 ? size * moneyPerSize(b, dist * rr, exit) : 0;
  const feeTp = exit > 0 ? size * feePer(b, entry, exit) : 0;
  const net = gain - feeTp;
  const valPer = notionalPer(b, entry);
  const value = size * valPer, margin = value / b.lev;
  const maxSize = Math.max(0, +roundDown(eq * b.lev / valPer, b.step).toFixed(b.sd));
  const sizeTxt = fmtN(size, b.sd);

  // rough isolated liquidation for crypto perps: entry x (1 -/+ (1/leverage - maintenance margin))
  let liq = null, liqHit = false;
  if (a.coin) {
    const k = 1 / b.lev - b.mmr;
    liq = k > 0 ? entry * (1 - side * k) : entry;
    liqHit = side === 1 ? sl <= liq : sl >= liq;
  }

  $('t-size').textContent = sizeTxt;
  $('t-unit').textContent = coinName;
  $('t-auto').hidden = !slAuto;
  $('t-auto').textContent = slAuto ? t('autoNote', trim(state.stopPct)) : '';

  // price ladder, drawn top (higher price) to bottom
  const feeTxt = f => b.fee > 0 ? `, ${t('inclFees')} ${fmtUsd(f)}` : '';
  const tpRow = { cls: 'tp', name: t('tp'), price: exit, amt: exit > 0 ? sgn(net) : '–', sub: `+${fmtN(dist * rr / pip, 1)} ${unitTxt}${feeTxt(feeTp)}` };
  const enRow = { cls: 'en', name: t('enTag'), price: entry, amt: '', sub: '' };
  const slRow = { cls: 'sl', name: t('slTag'), price: sl, amt: '-' + fmtUsd(lossAll), sub: `-${fmtN(dist / pip, 1)} ${unitTxt}${feeTxt(feeSl)}` };
  const rrc = Math.min(Math.max(rr, 0.25), 5), total = 150;
  const hWin = Math.max(22, total * rrc / (rrc + 1)), hLoss = Math.max(22, total / (rrc + 1));
  const zone = (cls, h) => `<div class="lad-zone ${cls}" style="height:${h.toFixed(0)}px"><i></i><span></span></div>`;
  const row = r => `<div class="lad-row ${r.cls}"><span class="lad-dot"></span><div><span class="lad-name">${r.name}</span><span class="lad-price">${r.price > 0 ? fmtN(r.price, dec) : '–'}</span></div><div class="lad-amt">${r.amt ? `<b>${r.amt}</b>${r.sub}` : ''}</div></div>`;
  $('ladder').innerHTML = side === 1
    ? row(tpRow) + zone('win', hWin) + row(enRow) + zone('loss', hLoss) + row(slRow)
    : row(slRow) + zone('loss', hLoss) + row(enRow) + zone('win', hWin) + row(tpRow);

  $('st-rr').textContent = `1 : ${trim(+rr.toFixed(2))}`;
  $('st-be').textContent = net > 0 ? `${fmtN(lossAll / (lossAll + net) * 100, 1)}%` : '–';
  $('st-val').textContent = fmtUsd(value);
  $('st-mg-lbl').textContent = t('statMg', trim(b.lev));
  $('st-mg').textContent = `${fmtUsd(margin)} (${fmtN(margin / eq * 100, 1)}%)`;
  $('st-fee').textContent = b.fee > 0 ? `${fmtUsd(feeSl)} / ${fmtUsd(feeTp)}` : t('noFees');
  $('st-liq').textContent = a.coin ? (liq > 0 ? fmtN(liq, dec) : '–') : t('liqNA');

  // warnings
  const w = [];
  if (liqHit) w.push(['bad', t('w_liq', liq > 0 ? fmtN(liq, dec) : '0', trim(b.lev))]);
  if (forcedMin && lossAll > riskUsd * 1.15) w.push(['bad', t('w_min', `${fmtN(b.minSz, b.sd)} ${coinName}`, fmtUsd(lossAll), fmtN(lossAll / eq * 100, 2))]);
  if (margin > eq) w.push(['bad', t('w_mgOver', fmtUsd(margin), fmtUsd(eq), trim(b.lev), `${fmtN(maxSize, b.sd)} ${coinName}`)]);
  else if (margin / eq > 0.5) w.push(['', t('w_mgHigh', fmtN(margin / eq * 100, 0))]);
  if (rp > 3) w.push(['', t('w_risk', trim(rp), fmtN((1 - Math.pow(1 - rp / 100, 5)) * 100, 1))]);
  if (!(exit > 0)) w.push(['bad', t('w_exitNeg')]);
  if (exit > 0 && net <= 0) w.push(['bad', t('w_feeEat', fmtUsd(feeTp), fmtUsd(gain))]);
  $('t-warn').innerHTML = w.map(([c, m]) => `<div class="warn ${c}">${m}</div>`).join('');

  // details: other targets (profit after fees)
  const targets = [1, 1.5, 2, 3];
  $('tp-table').innerHTML = `<tr><th>${t('target')}</th><th>${t('price')}</th><th>${t('profit')}</th></tr>` +
    targets.map(r => { const p = entry + side * dist * r; return `<tr><td>1 : ${r}</td><td>${p > 0 ? fmtN(p, dec) : '–'}</td><td>${p > 0 ? sgn(size * (moneyPerSize(b, dist * r, p) - feePer(b, entry, p))) : '–'}</td></tr>`; }).join('');

  // details: split
  document.querySelectorAll('#split-chips .pill').forEach(c => c.setAttribute('aria-pressed', +c.dataset.n === state.split));
  const units = Math.round(size / b.step), n = state.split;
  const base = Math.floor(units / n), extra = units - base * n;
  let rows = '';
  for (let i = 0; i < n; i++) {
    const u = base + (i < extra ? 1 : 0);
    if (u <= 0) continue;
    const sz = u * b.step;
    rows += `<tr><td>${t('order')} ${i + 1}</td><td>${fmtN(sz, b.sd)} ${coinName}</td><td>-${fmtUsd(sz * costPer)}</td></tr>`;
  }
  $('split-table').innerHTML = `<tr><th>${t('order')}</th><th>${t('size')}</th><th>${t('lossAtSl')}</th></tr>` + rows;

  // details: the numbers
  const mrow = (k, v) => `<tr><td>${t(k)}</td><td>${v}</td></tr>`;
  $('more-table').innerHTML =
    mrow('mRisk', `${fmtUsd(riskUsd)} (${trim(rp)}%)`) +
    mrow('mDist', `${fmtN(dist, dec)} (${fmtN(dist / pip, 1)} ${unitTxt})`) +
    mrow('mLossLot', fmtUsd(lossPer)) +
    mrow('mFeeRate', `${trim(b.fee * 100)}%`) +
    mrow('mFees', fmtUsd(feeSl)) +
    mrow('mRaw', `${fmtN(raw, Math.max(b.sd + 2, 4))} ${coinName}`) +
    mrow('mActual', `${fmtUsd(lossAll)} (${fmtN(lossAll / eq * 100, 2)}%)`) +
    mrow('mMax', `${fmtN(maxSize, b.sd)} ${coinName}`) +
    (a.coin ? mrow('mLiq', liq > 0 ? fmtN(liq, dec) : '–') : '');

  state.last = { side, sym, sizeTxt, coinName, entry: fmtN(entry, dec), sl: fmtN(sl, dec), tp: exit > 0 ? fmtN(exit, dec) : '-', loss: fmtUsd(lossAll), gain: sgn(net), rr: trim(+rr.toFixed(2)) };
  $('m-size').textContent = sizeTxt;
  $('m-unit').textContent = coinName;
  $('m-sl').textContent = `SL ${fmtN(sl, dec)}`;
  $('m-tp').textContent = `TP ${exit > 0 ? fmtN(exit, dec) : '–'}`;
  updateMbar();
}

function flash(id, text) {
  const el = $(id); el.textContent = text; el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 2200);
}
function copyText(text, okId) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) flash(okId, t('copied')); else window.prompt(t('copyFail'), text);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => flash(okId, t('copied')), fallback);
  else fallback();
}
function copyOrder() {

// ---------------- planner ----------------
function solveGrowth() {
  const start = num($('p-start').value), goal = num($('p-goal').value), steps = parseInt(num($('p-steps').value), 10);
  if (start > 0 && goal > start && steps > 0) {
    state.pg = (Math.pow(goal / start, 1 / steps) - 1) * 100;          // exact, used while the box is untouched
    state.pgStr = state.pg.toFixed(4);
    $('p-growth').value = state.pgStr;
  }
  plan();
}
function plan() {
  const b = broker(), a = b.a;
  const entry = num($('entry').value);
  const refPx = entry > 0 ? entry : a.ref;
  const sym = cleanSym($('symbol').value, a);
  const coinName = coinOf(sym, a);
  const unitTxt = t(a.unit === 'pts' ? 'u_pts' : 'u_pips');
  const goal = num($('p-goal').value);
  const start = num($('p-start').value) > 0 ? num($('p-start').value) : 1000;
  const steps = Math.min(100, Math.max(1, parseInt(num($('p-steps').value), 10) || 20));
  const gBox = $('p-growth').value.trim();
  const g = (state.pg && gBox === state.pgStr ? state.pg : (num(gBox) > 0 ? num(gBox) : 5)) / 100;
  const rr = num($('p-rr').value) > 0 ? num($('p-rr').value) : 2;
  const stop = num($('p-stop').value) > 0 ? num($('p-stop').value) : a.stop;
  const dec = priceDec(a, refPx), pip = pipSize(a, refPx);
  $('p-intro').textContent = t('p_intro', `${sym}, ${t('step').toLowerCase()} ${fmtN(b.step, b.sd)}`);
  $('p-stop-help').textContent = t('p_stopHelp', `${fmtN(stop, dec)} = ${fmtN(stop / pip, 1)} ${unitTxt} (${fmtN(stop / refPx * 100, 2)}%)`);

  const lossPer = moneyPerSize(b, stop, refPx) + feePer(b, refPx, Math.max(refPx - stop, 0));
  let bal = start, rows = [], minHits = 0, maxPct = 0;
  const labels = [t('start')], data = [start];
  for (let i = 1; i <= steps; i++) {
    const gain = bal * g, end = bal + gain, need = gain / rr;
    let size = +roundDown(need / lossPer, b.step).toFixed(b.sd);
    if (size < b.minSz) size = b.minSz;
    const risk = size * lossPer, pct = risk / bal * 100;
    const over = risk > need * 1.15;
    if (over) { minHits++; maxPct = Math.max(maxPct, pct); }
    rows.push({ i, bal, gain, risk, pct, size, end, over });
    labels.push(`${t('trade')} ${i}`); data.push(end);
    bal = end;
  }
  $('p-big').textContent = t('p_big', fmtUsd(start), fmtUsd(bal), steps);

  const riskNeed = g * 100 / rr;
  const w = [];
  if (!(goal > start)) w.push(['bad', t('p_goalLow')]);
  w.push(['', t('p_risk', fmtN(riskNeed, 2))]);
  if (riskNeed >= 100) w.push(['bad', t('p_impossible', fmtN(riskNeed, 1))]);
  else if (riskNeed > 3) w.push(['bad', t('p_aggr', fmtN(riskNeed, 1))]);
  if (minHits) w.push(['', t('p_min', minHits, steps, fmtN(maxPct, 1))]);
  const r1 = rows[0];
  w.push(['', t('p_real', fmtN(r1.pct, 2), fmtUsd(r1.risk), fmtN(r1.risk / (r1.bal - r1.risk) * 100, 2))]);
  $('p-warn').innerHTML = w.map(([c, m]) => `<div class="warn ${c}">${m}</div>`).join('');

  $('p-table').innerHTML = `<tr><th>${t('c_n')}</th><th>${t('c_start')}</th><th>${t('c_gain')}</th><th>${t('c_risk')}</th><th>${t('c_size')}</th><th>${t('c_end')}</th><th></th></tr>` +
    rows.map(r => `<tr class="${r.over ? 'amber' : ''}"><td>${r.i}</td><td>${fmtUsd(r.bal)}</td><td>+${fmtUsd(r.gain)}</td><td>-${fmtUsd(r.risk)} (${fmtN(r.pct, 2)}%)</td><td>${fmtN(r.size, b.sd)} ${coinName}</td><td>${fmtUsd(r.end)}</td><td><button class="usebtn" onclick="useStep(${r.i - 1})">${t('use')}</button></td></tr>`).join('');
  state.planRows = rows; state.planMeta = { rr, stop, coinName, sd: b.sd };
  drawChart(data);
}
function drawChart(data) {
  const W = 640, H = 220, L = 64, R = 12, T = 14, B = 26;
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  const x = i => L + (W - L - R) * (data.length === 1 ? 0 : i / (data.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / span);
  const pts = data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const css = getComputedStyle(document.documentElement);
  const acc = css.getPropertyValue('--accent').trim(), line = css.getPropertyValue('--line').trim();
  const short = v => v >= 1e6 ? '$' + fmtN(v / 1e6, 2) + 'M' : v >= 1e4 ? '$' + fmtN(v / 1e3, 1) + 'k' : '$' + fmtN(v, 0);
  $('p-chart').innerHTML =
    `<line x1="${L}" y1="${y(max)}" x2="${W - R}" y2="${y(max)}" stroke="${line}"/>` +
    `<line x1="${L}" y1="${y(min)}" x2="${W - R}" y2="${y(min)}" stroke="${line}"/>` +
    `<text x="${L - 8}" y="${y(max) + 4}" text-anchor="end">${short(max)}</text>` +
    `<text x="${L - 8}" y="${y(min) + 4}" text-anchor="end">${short(min)}</text>` +
    `<polygon points="${x(0)},${y(min)} ${pts} ${x(data.length - 1)},${y(min)}" fill="${acc}" opacity="0.10"/>` +
    `<polyline points="${pts}" fill="none" stroke="${acc}" stroke-width="2.5" stroke-linejoin="round"/>` +
    `<text x="${L}" y="${H - 6}">${t('start')}</text>` +
    `<text x="${W - R}" y="${H - 6}" text-anchor="end">${t('trade')} ${data.length - 1}</text>`;
}
function useStep(idx) {
  const r = state.planRows[idx], m = state.planMeta; if (!r) return;
  const a = ASSETS[state.asset];
  $('equity').value = fmtN(r.bal, 2);
  $('riskpct').value = Math.ceil(r.pct * 100) / 100;
  state.rr = m.rr; $('rr-custom').value = m.rr; $('exit').value = '';
  const entry = num($('entry').value);
  if (entry > 0) {
    const s = entry - state.side * m.stop;
    if (s > 0) $('sl').value = +s.toFixed(priceDec(a, entry));
  }
  showTab('sizer');
  window.scrollTo({ top: 0 });
}
function copyPlan() {
  const rows = state.planRows || [], m = state.planMeta || {};
  const csv = [['Trade', 'Start balance', 'Target gain', 'Risk at stop', 'Risk %', 'Size', 'End balance'].join(',')]
    .concat(rows.map(r => [r.i, r.bal.toFixed(2), r.gain.toFixed(2), r.risk.toFixed(2), r.pct.toFixed(2), r.size.toFixed(m.sd), r.end.toFixed(2)].join(','))).join('\n');
  copyText(csv, 'plan-ok');
}

// ---------------- disclaimer ----------------
function discAccepted() { try { return sessionStorage.getItem('ps-disc') === '1'; } catch (e) { return false; } }
function openDisc() {
  const acc = discAccepted();
  $('disc-check-wrap').hidden = acc;
  $('disc-go').disabled = !acc;
  $('disc').hidden = false;
  document.body.style.overflow = 'hidden';
  $('disc-go').focus();
}
function closeDisc() {
  if (!discAccepted()) {
    if (!$('disc-check').checked) return;
    try { sessionStorage.setItem('ps-disc', '1'); } catch (e) {}
  }
  $('disc').hidden = true;
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('disc').hidden && discAccepted()) closeDisc(); });

// ---------------- wiring ----------------
document.querySelectorAll('#asset-pills .pill').forEach(b => b.addEventListener('click', () => setAsset(b.dataset.a)));
document.querySelectorAll('#risk-chips .pill').forEach(b => b.addEventListener('click', () => { $('riskpct').value = b.dataset.r; calc(); }));
document.querySelectorAll('#rr-chips .pill').forEach(b => b.addEventListener('click', () => setRR(num(b.dataset.rr))));
document.querySelectorAll('#split-chips .pill').forEach(b => b.addEventListener('click', () => { state.split = +b.dataset.n; calc(); }));
document.querySelectorAll('#stop-chips .pill').forEach(b => b.addEventListener('click', () => setStop(num(b.dataset.s))));

if ('IntersectionObserver' in window) {
  new IntersectionObserver(es => { state.ticketVisible = es[0].isIntersecting; updateMbar(); }, { threshold: 0.15 }).observe(document.querySelector('.ticket'));
}
const _showTab = showTab;
showTab = function (tab) { _showTab(tab); updateMbar(); };

(function init() {
  let l = (navigator.language || '').toLowerCase().startsWith('ms') ? 'bm' : 'en', th = 'light';
  try { l = localStorage.getItem('ps-lang') || l; th = localStorage.getItem('ps-theme') || th; } catch (e) {}
  state.lang = l; state.theme = th;
  document.documentElement.setAttribute('data-theme', th);
  applyText();
  setAsset('crypto', false);
  solveGrowth();
  calc();
  if (!discAccepted()) openDisc();
})();
</script>
